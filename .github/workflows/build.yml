name: Build ImmortalWrt APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step untuk membuat variabel tanggal (YYYYMMDD)
      - name: Get Current Date
        id: date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Build Package
        run: |
          sudo apt update && sudo apt install -y build-essential rsync wget tar zstd

          # Download & Ekstrak SDK ImmortalWrt
          wget https://downloads.immortalwrt.org/releases/25.12.0-rc2/targets/x86/64/immortalwrt-sdk-25.12.0-rc2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          tar -I zstd -xf *.tar.zst --strip-components=1

          # Masukkan source code paket ke SDK
          mkdir -p package/luci-app-imei-changer
          cp -r $GITHUB_WORKSPACE/luci-app-imei-changer/* package/luci-app-imei-changer/

          # Update Feeds & Compile
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          echo "CONFIG_PACKAGE_luci-app-imei-changer=y" >> .config
          make package/luci-app-imei-changer/compile V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          # Nama artifact zip sekarang menyertakan tanggal (contoh: imei-changer-v1-20260916)
          name: imei-changer-${{ steps.date.outputs.DATE }}
          path: bin/packages/**/*.apk
