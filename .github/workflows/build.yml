- name: Build Package
        run: |
          sudo apt update && sudo apt install -y build-essential rsync wget tar xz-utils
          
          # URL SDK diarahkan ke OpenWrt resmi (contoh arsitektur x86/64)
          # Catatan: Jika versi 25.12.2 belum rilis stabil, gunakan snapshots
          SDK_URL="https://downloads.openwrt.org/releases/25.12.2/targets/x86/64/openwrt-sdk-25.12.2-x86-64_gcc-14.2.0_musl.Linux-x86_64.tar.xz"
          
          # Jika link di atas 404, gunakan link snapshot sebagai cadangan
          wget $SDK_URL -O sdk.tar.xz || wget https://downloads.openwrt.org/snapshots/targets/x86/64/openwrt-sdk-x86-64_gcc-14.2.0_musl.Linux-x86_64.tar.xz -O sdk.tar.xz
          
          tar -xJf sdk.tar.xz --strip-components=1
          
          # Sinkronisasi folder aplikasi imei-changer
          mkdir -p package/luci-app-imei-changer
          cp -r $GITHUB_WORKSPACE/luci-app-imei-changer/* package/luci-app-imei-changer/
          
          # Proses Kompilasi
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          echo "CONFIG_PACKAGE_luci-app-imei-changer=m" >> .config
          make package/luci-app-imei-changer/compile V=s
